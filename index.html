<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!--
      Backend API redirect: MUST be the first script in <head> so it runs
      BEFORE the speculative parser in Brave/Safari discovers <script type="module">
      in <body>. If the Service Worker served this page for a /backend/ URL,
      stop all parsing, unregister SW, and hard-navigate to the real server.
    -->
    <script>
      (function () {
        if (location.pathname.indexOf("/backend/") !== 0) return;

        // Stop HTML parser immediately — <body> never gets parsed,
        // so <script type="module" src="/src/main.js"> is never discovered.
        // This is critical for Brave and Safari whose speculative parsers
        // are more aggressive than Chrome/Firefox.
        window.stop();

        var key = "__backend_sw_retry";
        var retried = false;
        try {
          retried = !!sessionStorage.getItem(key);
        } catch (e) {}

        if (retried) {
          // Second attempt also landed here — SW is gone but server
          // still returned index.html (misconfiguration). Show fallback.
          try {
            sessionStorage.removeItem(key);
          } catch (e) {}
          document.open();
          document.write(
            "<!doctype html><html><head><title>Redirecting\u2026</title></head>" +
              '<body style="display:grid;place-items:center;height:100vh;font-family:system-ui">' +
              '<div style="text-align:center">' +
              "<p>Halaman tidak dapat dimuat otomatis.</p>" +
              '<p><a href="' +
              location.href +
              '" style="color:#ff9800">Klik di sini untuk mencoba lagi</a></p>' +
              "</div></body></html>",
          );
          document.close();
          return;
        }

        try {
          sessionStorage.setItem(key, "1");
        } catch (e) {}

        function hardNav() {
          location.replace(location.href);
        }

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then(function (r) {
              return Promise.all(
                r.map(function (sw) {
                  return sw.unregister();
                }),
              );
            })
            .then(hardNav)
            .catch(hardNav);
        } else {
          hardNav();
        }
      })();
    </script>

    <!-- Favicons (cache-busted) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon32.png?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon16.png?v=6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="apple-touch-icon" href="/icon192.png?v=6" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff9800" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ff9800;
        transition:
          opacity 0.3s ease,
          visibility 0.3s ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .splash-title {
        font:
          800 clamp(36px, 8vw, 72px) / 1 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        color: #fff;
        text-transform: uppercase;
        animation: breathe 3s ease-in-out infinite;
        will-change: transform, opacity;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-title {
          animation: none;
        }
      }

      /* Hanya tampil di bawah sm (Tailwind sm = 640px) */
      @media (min-width: 640px) {
        #splash {
          display: none;
        }
      }

      #splash-logo {
        animation: breathe 3s ease-in-out infinite;
        will-change: transform, opacity;
        height: 64px;
      }
    </style>
    <title>Sumilir – Marketplace UMKM Lokal Banyuanyar</title>
    <meta
      name="description"
      content="Sumilir adalah marketplace UMKM lokal Banyuanyar untuk produk kuliner, toko, dan jasa."
    />
  </head>
  <body>
    <!-- Splash -->
    <div id="splash" aria-hidden="true">
      <!-- <div class="splash-title">SUMILIR</div> -->
      <img
        id="splash-logo"
        src="/src/assets/icons/White-with-Text.png"
        alt="SUMILIR"
      />
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sumilir",
        "url": "https://sumilir.web.id",
        "logo": "https://sumilir.web.id/favicon.png",
        "description": "Marketplace UMKM lokal Banyuanyar untuk produk kuliner, toko, dan jasa.",
        "sameAs": []
      }
    </script>
  </body>
</html>
