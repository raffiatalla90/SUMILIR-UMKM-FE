<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon16.png ?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon32.png?v=5" />
    <link rel="icon" sizes="any" href="/favicon.png?v=5" />
    <link rel="shortcut icon" href="/favicon.ico?v=5" />

    <!-- SVG (OPSIONAL, FIREFOX SAJA) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <meta name="theme-color" content="#ff9800" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ff9800;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .splash-title {
        font: 800 clamp(36px, 8vw, 72px) / 1 system-ui, -apple-system, Segoe UI,
          Roboto, Arial, sans-serif;
        color: #fff;
        text-transform: uppercase;
        animation: breathe 3s ease-in-out infinite;
        will-change: transform, opacity;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-title {
          animation: none;
        }
      }

      /* Hanya tampil di bawah sm (Tailwind sm = 640px) */
      @media (min-width: 640px) {
        #splash {
          display: none;
        }
      }

      #splash-logo {
        animation: breathe 3s ease-in-out infinite;
        will-change: transform, opacity;
        height: 64px;
      }
    </style>
    <title>SUMILIR</title>
  </head>
  <body>
    <!-- Splash -->
    <div id="splash" aria-hidden="true">
      <!-- <div class="splash-title">SUMILIR</div> -->
      <img
        id="splash-logo"
        src="/src/assets/icons/White-with-Text.png"
        alt="SUMILIR"
      />
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
