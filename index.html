<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons (cache-busted) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon32.png?v=6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon16.png?v=6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
    <link rel="apple-touch-icon" href="/icon192.png?v=6" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff9800" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ff9800;
        transition:
          opacity 0.3s ease,
          visibility 0.3s ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .splash-title {
        font:
          800 clamp(36px, 8vw, 72px) / 1 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        color: #fff;
        text-transform: uppercase;
        animation: breathe 3s ease-in-out infinite;
        will-change: transform, opacity;
      }

      @keyframes breathe {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-title {
          animation: none;
        }
      }

      /* Hanya tampil di bawah sm (Tailwind sm = 640px) */
      @media (min-width: 640px) {
        #splash {
          display: none;
        }
      }

      #splash-logo {
        animation: breathe 3s ease-in-out infinite;
        will-change: transform, opacity;
        height: 64px;
      }
    </style>
    <title>Sumilir – Marketplace UMKM Lokal Banyuanyar</title>
    <meta
      name="description"
      content="Sumilir adalah marketplace UMKM lokal Banyuanyar untuk produk kuliner, toko, dan jasa."
    />
  </head>
  <body>
    <!--
      Fix: Backend API routes (e.g. /backend/api/auth/verify-email/...)
      should NEVER be handled by the Vue SPA. If the Service Worker
      incorrectly served this index.html for a /backend/ URL, unregister
      the SW and reload so the request reaches the actual server.
    -->
    <script>
      (function () {
        var path = window.location.pathname;
        var key = "__backend_sw_retry";

        // Not a backend path → clear flag and continue normally
        if (path.indexOf("/backend/") !== 0) {
          try {
            sessionStorage.removeItem(key);
          } catch (e) {}
          return;
        }

        // Prevent infinite reload: only retry once
        try {
          if (sessionStorage.getItem(key)) {
            sessionStorage.removeItem(key);
            return; // already retried, let Vue handle gracefully
          }
          sessionStorage.setItem(key, "1");
        } catch (e) {}

        function reload() {
          window.location.reload();
        }

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .getRegistrations()
            .then(function (regs) {
              return Promise.all(
                regs.map(function (r) {
                  return r.unregister();
                }),
              );
            })
            .then(reload)
            .catch(reload);
        } else {
          reload();
        }
      })();
    </script>

    <!-- Splash -->
    <div id="splash" aria-hidden="true">
      <!-- <div class="splash-title">SUMILIR</div> -->
      <img
        id="splash-logo"
        src="/src/assets/icons/White-with-Text.png"
        alt="SUMILIR"
      />
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Sumilir",
        "url": "https://sumilir.web.id",
        "logo": "https://sumilir.web.id/favicon.png",
        "description": "Marketplace UMKM lokal Banyuanyar untuk produk kuliner, toko, dan jasa.",
        "sameAs": []
      }
    </script>
  </body>
</html>
