name: Deploy Vue FE to Server

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Create .env.production
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }} # contoh: sumilir.indonesiacentral.cloudapp.azure.com
        run: |
          HOST=${SERVER_HOST:-sumilir.indonesiacentral.cloudapp.azure.com}
          cat > .env.production << EOF
          VITE_APP_NAME="SIMSLIFE"
          VITE_APP_URL=https://$HOST
          VITE_PUBLIC_BASE_PATH=/
          # API relative path agar aman HTTPS (diproxy Nginx ke backend)
          VITE_API_BASE_URL=/api
          VITE_API_PREFIX=/api
          VITE_HTTP_TIMEOUT_MS=20000
          # Optional: cooldown forgot password agar sinkron default
          VITE_FORGOT_PASSWORD_COOLDOWN=60
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fallback jika lockfile belum ter-update di repo
      - name: Ensure workbox-window exists
        run: pnpm add workbox-window@^7 --no-save

      - name: Build project (PWA)
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: pnpm run build --mode production

      - name: Clean remote dist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /var/www/KMI-SIMSLIFE-FE/dist
            rm -rf /var/www/KMI-SIMSLIFE-FE/dist/*

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/**"
          target: "/var/www/KMI-SIMSLIFE-FE/dist"
          strip_components: 1
          overwrite: true
