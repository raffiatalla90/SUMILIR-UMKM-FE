name: Vue (Vite) CI/CD -> SFTP (zip upload)

on:
  push:
    branches: [staging]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${{ secrets.FTP_PORT }}" "${{ secrets.FTP_SERVER }}" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Setup SSH key
        run: |
          echo "${{ secrets.FTP_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Build production
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: npm run build

      - name: Zip dist
        run: |
          cd dist
          zip -r ../dist.zip . >/dev/null
          cd ..
          ls -lh dist.zip

      - name: Upload dist.zip to server (SCP)
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.FTP_SSH_KEY }}
          port: ${{ secrets.FTP_PORT }}
          source: "dist.zip"
          target: "/tmp"

      - name: Unzip frontend to public_html
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.FTP_SSH_KEY }}
          port: ${{ secrets.FTP_PORT }}
          script: |
            set -e
            TARGET="${{ secrets.FTP_PATH_FRONTEND }}"   # ex: /public_html
            mkdir -p "$TARGET"
            # remove existing files in target (optional)
            rm -rf "$TARGET"/* || true
            unzip -o /tmp/dist.zip -d "$TARGET"
            rm -f /tmp/dist.zip
            # ensure index.html not cached too long
            echo "Deployed frontend to $TARGET"
