name: Deploy Vue FE to Server

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # Buat .env.production (Vite membaca variabel ini saat build)
      - name: Create .env.production
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          HOST=${SERVER_HOST:-70.153.25.109}  # fallback jika secret belum diset
          cat > .env.production << EOF
          VITE_APP_NAME="SUMILIR"
          VITE_APP_URL=http://$HOST
          VITE_PUBLIC_BASE_PATH=/

          # API lewat Nginx (tanpa :8000)
          VITE_API_BASE_URL=http://$HOST/api
          VITE_API_PREFIX=/api
          VITE_SANCTUM_ENDPOINT=/sanctum/csrf-cookie
          VITE_WITH_CREDENTIALS=true
          VITE_HTTP_TIMEOUT_MS=20000

          VITE_FEATURE_ECHO=true
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build --mode production

      # Bersihkan folder dist di server agar tidak ada file lama tertinggal
      - name: Clean remote dist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /var/www/KMI-SIMSLIFE-FE/dist
            rm -rf /var/www/KMI-SIMSLIFE-FE/dist/*

      # Upload isi dist ke folder dist Nginx
      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/**"
          target: "/var/www/KMI-SIMSLIFE-FE/dist"
          strip_components: 1
          overwrite: true
